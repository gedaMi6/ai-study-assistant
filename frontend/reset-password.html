<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | AI STUDY ASSISTANT</title>

    <link rel="stylesheet" href="/css/auth.css">

    <style>
        .reset-step {
            display: none;
        }

        .reset-step.active {
            display: block;
        }

        .reset-code {
            text-align: center;
            letter-spacing: 8px;
            font-size: 24px;
            font-weight: 700;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="logo">
        KENENI<span>.AI</span>
    </div>

    <div class="auth-card">

        <h1>Reset your password</h1>

        <p class="subtitle" id="subtitle">
            Enter your email and we'll send you a reset code.
        </p>

        <!-- STEP 1 -->
        <div id="stepEmail" class="reset-step active">

            <form id="emailForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button
                    type="submit"
                    class="auth-button"
                    id="emailButton"
                >
                    Send reset code
                </button>

            </form>

        </div>


        <!-- STEP 2 -->
        <div id="stepCode" class="reset-step">

            <form id="codeForm">

                <div class="form-group">
                    <label for="code">6-digit reset code</label>

                    <input
                        type="text"
                        id="code"
                        class="reset-code"
                        placeholder="000000"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="auth-button"
                    id="codeButton"
                >
                    Verify code
                </button>

            </form>

        </div>


        <!-- STEP 3 -->
        <div id="stepPassword" class="reset-step">

            <form id="passwordForm">

                <div class="form-group">
                    <label for="newPassword">New password</label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <button
                    type="submit"
                    class="auth-button"
                    id="passwordButton"
                >
                    Reset password
                </button>

            </form>

        </div>


        <div id="message" class="message"></div>

        <a href="/login.html" class="back-login">
            ← Back to login
        </a>

    </div>

</div>


<script>

let resetEmail = "";
let resetCode = "";

const subtitle = document.getElementById("subtitle");
const message = document.getElementById("message");

const stepEmail = document.getElementById("stepEmail");
const stepCode = document.getElementById("stepCode");
const stepPassword = document.getElementById("stepPassword");


function showMessage(text, type = "") {

    message.className = "message";

    if (type) {
        message.classList.add(type);
    }

    message.textContent = text;
}


function showStep(step) {

    stepEmail.classList.remove("active");
    stepCode.classList.remove("active");
    stepPassword.classList.remove("active");

    step.classList.add("active");
}


/* STEP 1 */

document
    .getElementById("emailForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const button =
            document.getElementById("emailButton");

        resetEmail =
            document.getElementById("email")
                .value
                .trim()
                .toLowerCase();

        button.disabled = true;
        button.textContent = "Sending...";
        showMessage("");

        try {

            const response = await fetch(
                "/auth/forgot-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: resetEmail
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Could not send reset code."
                );
            }

            showStep(stepCode);

            subtitle.textContent =
                "Check your email for the 6-digit reset code.";

            showMessage(
                data.message,
                "success"
            );

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Send reset code";
        }
    });


/* STEP 2 */

document
    .getElementById("codeForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const button =
            document.getElementById("codeButton");

        resetCode =
            document.getElementById("code")
                .value
                .trim();

        button.disabled = true;
        button.textContent = "Verifying...";
        showMessage("");

        try {

            const response = await fetch(
                "/auth/verify-reset-code",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: resetEmail,
                        code: resetCode
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Invalid reset code."
                );
            }

            showStep(stepPassword);

            subtitle.textContent =
                "Choose a new password for your account.";

            showMessage(
                "Code verified successfully.",
                "success"
            );

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Verify code";
        }
    });


/* STEP 3 */

document
    .getElementById("passwordForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const button =
            document.getElementById("passwordButton");

        const newPassword =
            document.getElementById("newPassword")
                .value;

        const confirmPassword =
            document.getElementById("confirmPassword")
                .value;

        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }

        button.disabled = true;
        button.textContent = "Resetting...";
        showMessage("");

        try {

            const response = await fetch(
                "/auth/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: resetEmail,
                        code: resetCode,
                        new_password: newPassword
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Could not reset password."
                );
            }

            showMessage(
                "Password reset successfully. Redirecting to login...",
                "success"
            );

            setTimeout(() => {
                window.location.href = "/login.html";
            }, 1500);

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

            button.disabled = false;
            button.textContent = "Reset password";
        }
    });

</script>

</body>
</html>
